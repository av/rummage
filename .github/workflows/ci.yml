name: CI

# Everything runs on the self-hosted runner on fedora, in containers (docker/Dockerfile's CPU
# toolchain, and Microsoft's Playwright image for the UI), with caches kept on fedora.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CACHE_DIR: /mnt/models/rummage/ci/cache
  TARGET_DIR: /mnt/models/rummage/ci/target/check
  MODEL_DIR: /mnt/models/rummage/gguf

jobs:
  check:
    name: fmt, clippy, test (cpu)
    runs-on: [self-hosted, fedora]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Toolchain image
        run: docker build -q -f docker/Dockerfile --target toolchain -t rummage-toolchain:cpu .
      - name: Wait for a quiet machine
        run: docker/wait-load.sh
      - run: docker/in-toolchain.sh rummage-toolchain:cpu cargo fmt --all --check
      - run: docker/in-toolchain.sh rummage-toolchain:cpu cargo clippy --workspace --all-targets --features rummage/cpu --locked -- -D warnings
      - run: docker/in-toolchain.sh rummage-toolchain:cpu cargo test --workspace --features rummage/cpu --locked

  ui:
    name: web UI (check, build, Playwright)
    runs-on: [self-hosted, fedora]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Images
        run: |
          docker build -q -f docker/Dockerfile --target toolchain -t rummage-toolchain:cpu .
          pw=$(grep -oE '"@playwright/test@[0-9.]+' crates/rummage/ui/bun.lock | cut -d@ -f3)
          docker build -q -f docker/ui-test.Dockerfile --build-arg PLAYWRIGHT=$pw -t rummage-ui-test:$pw docker
          echo "UI_IMAGE=rummage-ui-test:$pw" >> "$GITHUB_ENV"
      - name: Wait for a quiet machine
        run: docker/wait-load.sh
      - name: bun install, check, build, size
        run: |
          docker/in-toolchain.sh $UI_IMAGE bash -c 'cd crates/rummage/ui &&
            bun install --frozen-lockfile && bun run check && bun run build && bun run size'
      - run: docker/in-toolchain.sh rummage-toolchain:cpu cargo build -p rummage --features rummage/cpu --locked
      # Additive API changes pass; changes that break the UI or the mock fail here.
      # (`bun run gen:api` with SPEC=<openapi.json> refreshes the committed types.)
      - name: UI still type-checks against the server's OpenAPI description
        run: |
          docker/in-toolchain.sh $UI_IMAGE bash -ec '
            cd crates/rummage/ui
            dir=$(mktemp -d)
            printf "data_dir = \"%s/data\"\n" "$dir" > "$dir/config.toml"
            RUMMAGE_CONFIG="$dir/config.toml" /target/debug/rummage serve --bind 127.0.0.1:4190 &
            server=$!
            for _ in $(seq 50); do curl -sf http://127.0.0.1:4190/api/openapi.json -o "$dir/openapi.json" && break; sleep 0.2; done
            kill $server
            SPEC="$dir/openapi.json" bun run gen:api
            bun run check'
      - name: Playwright
        env:
          RUMMAGE_BIN: /target/debug/rummage
        run: docker/in-toolchain.sh $UI_IMAGE bash -c 'cd crates/rummage/ui && bun x playwright test'
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: playwright-report
          path: crates/rummage/ui/playwright-report
          retention-days: 7

  # Every backend: built, tested, packed and turned into an image.
  backends:
    uses: ./.github/workflows/build.yml
