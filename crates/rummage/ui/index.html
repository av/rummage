<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<title>rummage</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<script>
  try {
    var t = localStorage.getItem('rummage.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<noscript>rummage needs JavaScript for its search page. The API is at <a href="api/docs">api/docs</a>.</noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
