[package]
name = "rummage-embed"
description = "EmbeddingGemma 2 embedding engine for rummage, on llama.cpp (libllama + libmtmd)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"
links = "llama"

[features]
default = ["cpu"]
# The CPU backend is always built in; `cpu` only names the default build.
cpu = []
vulkan = []
rocm = []
cuda = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
rummage-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ureq.workspace = true

[dev-dependencies]
hound = "3"

[build-dependencies]
cc = "1"
cmake = "0.1"
