                        - img "A result open on a phone, with More like this, Open and Download" [ref=f1e327]
              - generic [ref=f1e328]:
                - heading "Try it" [level=2] [ref=f1e329]
                - 'link "Permalink: Try it" [ref=f1e330] [cursor=pointer]':
                  - /url: "#try-it"
              - paragraph [ref=f1e333]:
                - text: For now rummage is built for
                - strong [ref=f1e334]: Linux x86_64 only
                - text: "(Ubuntu 22.04, Debian 12 or newer): there is no macOS or Windows build yet. This is the Vulkan build, which runs on any recent AMD, NVIDIA or Intel GPU, or on the CPU, more slowly. It needs a CPU with AVX2 (Intel Haswell, AMD Zen or newer) and, for video and HEIC photos,"
                - link "ffmpeg" [ref=f1e335] [cursor=pointer]:
                  - /url: https://ffmpeg.org
                - text: (for PDF page pictures,
                - code [ref=f1e336]: poppler-utils
                - text: ).
              - generic [ref=f1e337]:
                - generic [ref=f1e338]: curl -LO https://github.com/av/rummage/releases/download/v0.1.2/rummage-0.1.2-linux-x86_64-vulkan.tar.gz tar xzf rummage-0.1.2-linux-x86_64-vulkan.tar.gz cd rummage-0.1.2-linux-x86_64-vulkan ./rummage folders add ~/Pictures ./rummage serve
                - button "Copy code to clipboard" [ref=f1e340] [cursor=pointer]
              - paragraph [ref=f1e344]:
                - text: Open
                - link "http://127.0.0.1:8099/" [ref=f1e345] [cursor=pointer]:
                  - /url: http://127.0.0.1:8099/
                - text: and describe what you are looking for. The first run downloads the model (about 865 MB); results appear as files are indexed.
              - paragraph [ref=f1e346]:
                - text: On a Radeon 8060S, the 111-file demo library above is indexed in under two minutes. Other builds (ROCm, CUDA, CPU), Docker images and building from source are in
                - link "Install" [ref=f1e347] [cursor=pointer]:
                  - /url: /av/rummage/blob/feature/revamp-readme-as-lan-3be/docs/install.md
                - text: ; the command line and everything the page can do are in
                - link "Using rummage" [ref=f1e348] [cursor=pointer]:
                  - /url: /av/rummage/blob/feature/revamp-readme-as-lan-3be/docs/usage.md
                - text: .
              - generic [ref=f1e349]:
                - heading "Good to know" [level=2] [ref=f1e350]
                - 'link "Permalink: Good to know" [ref=f1e351] [cursor=pointer]':
                  - /url: "#good-to-know"
              - paragraph [ref=f1e354]:
                - text: "rummage is young: 0.1, a pre-release. It has been run over a real library of about 4,500 photos, videos, recordings, notes and PDFs; the"
                - link "review" [ref=f1e355] [cursor=pointer]:
                  - /url: /av/rummage/blob/feature/revamp-readme-as-lan-3be/docs/REVIEW-2026-10.md
                - text: has the numbers and the
                - link "benchmarks" [ref=f1e356] [cursor=pointer]:
                  - /url: /av/rummage/blob/feature/revamp-readme-as-lan-3be/docs/BENCH-fedora.md
                - text: compare the GPU backends with the CPU.
              - list [ref=f1e357]:
                - listitem [ref=f1e358]: Search ranks by likeness, so a query with no true match still shows the closest files.
                - listitem [ref=f1e359]: "It finds things by what they show and say, not by who is in them: there is no face recognition."
                - listitem [ref=f1e360]: The first pass over a big library takes a while, and about six to eight times longer without a GPU.
              - paragraph [ref=f1e361]:
                - text: Bug reports and ideas are welcome in
                - link "Issues" [ref=f1e362] [cursor=pointer]:
                  - /url: https://github.com/av/rummage/issues
                - text: .
              - generic [ref=f1e363]:
                - heading "Under the hood" [level=2] [ref=f1e364]
                - 'link "Permalink: Under the hood" [ref=f1e365] [cursor=pointer]':
                  - /url: "#under-the-hood"
              - paragraph [ref=f1e368]:
                - text: One model, Google DeepMind’s multilingual
                - link "EmbeddingGemma 2" [ref=f1e369] [cursor=pointer]:
                  - /url: https://huggingface.co/google/embeddinggemma-2
                - text: ", turns text, images, sound and video frames into the same kind of vector, so a sentence can sit next to the thing it describes. It runs on"
                - link "llama.cpp" [ref=f1e370] [cursor=pointer]:
                  - /url: https://github.com/ggml-org/llama.cpp
                - text: ", built into the binary, and keyword search (names, text, photo dates and cameras) is mixed in with the meaning search."
                - link "How it works" [ref=f1e371] [cursor=pointer]:
                  - /url: /av/rummage/blob/feature/revamp-readme-as-lan-3be/docs/how-it-works.md
                - text: has the details.
