              - paragraph [ref=f1e298]:
                - text: Photos, videos, recordings, PDFs and text sit in the same results, so a search for the whales also turns up the booking PDF whose page has a whale photo on it. Every query and file shown here is listed in
                - link "Screenshots and demo library" [ref=f1e299] [cursor=pointer]:
