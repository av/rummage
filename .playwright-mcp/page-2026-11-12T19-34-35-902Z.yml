              - generic [ref=f1e300]:
                - heading "Why you’ll like it" [level=2] [ref=f1e301]
                - 'link "Permalink: Why you’ll like it" [ref=f1e302] [cursor=pointer]':
                  - /url: "#why-youll-like-it"
              - list [ref=f1e305]:
                - listitem [ref=f1e306]:
                  - strong [ref=f1e307]: It is yours.
                  - text: Your files and your searches never leave the machine. No account, no upload, no subscription. rummage only reads your files; its index and thumbnails live in a folder of their own. The model is downloaded once; after that it works offline.
                - listitem [ref=f1e308]:
                  - strong [ref=f1e309]: It points at the moment.
                  - text: A video result starts playing where the match is, an audio result at the matching seconds, a PDF result shows the page. Phone videos in HEVC, which many browsers can’t play, are converted on the fly so they play too.
                - listitem [ref=f1e310]:
                  - strong [ref=f1e311]: It is quick.
                  - text: "A search answers in about 10 ms, on a library of 4,500 files too. Results fill in while a folder is still being indexed, and it keeps up with you: new, edited, moved and deleted files are picked up as they happen."
                - listitem [ref=f1e312]:
                  - strong [ref=f1e313]: It understands more than English.
                  - text: "The same search works in Japanese, German and other languages, and you can search by example: drop a photo, a sound or a note on the page, or press “More like this” on any result. Narrow results by kind, folder and date."
                - listitem [ref=f1e314]:
                  - strong [ref=f1e315]: It fits how you work.
                  - text: A web page (dark and light, and it works on a phone), a command line and an HTTP API for scripts, in one program that uses an AMD, NVIDIA or Intel GPU and falls back to the CPU.
              - paragraph [ref=f1e316]:
                - subscript [ref=f1e317]: The same search on a phone.
              - table [ref=f1e319]:
                - rowgroup [ref=f1e320]:
                  - row [ref=f1e321]:
                    - cell [ref=f1e322]:
